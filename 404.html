<!doctype html>
<html lang="en" dir="ltr">

  <style>
    :root { --navy-950: #040c38; --navy-900: #071660; --navy: #0b228a; --iri: linear-gradient(110deg, #9fe8ff, #c9a8ff 35%, #ffb4da 65%, #fff1a6); }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 32px 16px; text-align: center; color: #fff;
      font-family: "Plus Jakarta Sans", "Tajawal", system-ui, sans-serif;
      background: radial-gradient(900px 600px at 80% 110%, rgba(47,111,224,.75), transparent 60%),
        radial-gradient(700px 500px at 10% -10%, rgba(120,90,255,.35), transparent 60%),
        linear-gradient(160deg, var(--navy-950), var(--navy-900) 45%, var(--navy));
    }
    img { width: 160px; height: auto; margin: 0 auto 28px; display: block; filter: drop-shadow(0 6px 16px rgba(0,0,0,.3)); }
    .code { font-family: "Quicksand", sans-serif; font-weight: 700; font-size: clamp(5rem, 22vw, 9rem); line-height: 1;
      background: var(--iri); -webkit-background-clip: text; background-clip: text; color: transparent; margin: 0; }
    h1 { font-family: "Quicksand", sans-serif; font-size: clamp(1.5rem, 5vw, 2.2rem); margin: 12px 0 6px; }
    p { color: #cfdcff; margin: 0 0 4px; }
    .ar { font-family: "Tajawal", sans-serif; direction: rtl; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 28px; }
    a.btn { display: inline-flex; padding: 14px 26px; border-radius: 999px; font-weight: 700; text-decoration: none; }
    .btn--light { background: #fff; color: var(--navy); }
    .btn--ghost { color: #fff; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.5); font-family: "Tajawal", sans-serif; }
  </style>
</head>
